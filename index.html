<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เกมแกะรอยปริศนา</title><style>body{font:18px system-ui;background:#102038;color:white;padding:24px;max-width:700px;margin:auto}button{padding:12px;margin:5px;border:0;border-radius:8px;background:#ffd36b} .room{background:#284769;padding:18px;border-radius:12px;min-height:50px;cursor:pointer} .floor{display:grid;grid-template-columns:60px repeat(3,1fr);gap:8px;margin:8px 0}</style><h1>🕵️ เกมแกะรอยปริศนา</h1><p>เลือกเจ้าหน้าที่ แล้วแตะห้องเพื่อวาง (แตะอีกครั้งเพื่อนำออก)</p><div id="buttons"></div><div id="grid"></div><p id="status"></p><button onclick="location.reload()">เริ่มใหม่</button><script>let selected='A';let b={};for(let f=1;f<=4;f++)for(let c=0;c<3;c++)b[f+'-'+c]=[];function render(){buttons.innerHTML='';for(let p of 'ABCD'){let x=document.createElement('button');x.textContent=p+(p===selected?' ✓':'');x.onclick=()=>{selected=p;render()};buttons.append(x)}grid.innerHTML='';for(let f=4;f>=1;f--){let row=document.createElement('div');row.className='floor';row.innerHTML='<b>ชั้น '+f+'</b>';for(let c=0;c<3;c++){let k=f+'-'+c;let cell=document.createElement('div');cell.className='room';cell.textContent=(['ตะวันตก','กลาง','ตะวันออก'][c])+'\n'+(b[k].join(' ')||'—');cell.onclick=()=>{if(b[k].includes(selected))b[k]=b[k].filter(x=>x!==selected);else if(Object.values(b).filter(a=>a.includes(selected)).length<5)b[k].push(selected);render()};row.append(cell)}grid.append(row)}status.textContent='จำนวนห้อง: '+[...'ABCD'].map(p=>p+' '+Object.values(b).filter(a=>a.includes(p)).length+'/5').join(' · ')}render();</script></html>
